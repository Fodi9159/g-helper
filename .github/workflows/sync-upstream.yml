name: Sync Upstream and Release

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new upstream release
        id: check
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/seerge/g-helper/releases/latest | jq -r '.tag_name')
          echo "Upstream latest release: $UPSTREAM_TAG"
          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "Could not read upstream release"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$UPSTREAM_TAG" >/dev/null 2>&1; then
            echo "Tag $UPSTREAM_TAG already released on fork — nothing to do"
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream release detected: $UPSTREAM_TAG"
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          fi

  sync-and-release:
    needs: check
    if: needs.check.outputs.new_release == 'true'
    runs-on: windows-2022
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Sync with upstream (rebase, fork custom code wins)
        shell: bash
        run: |
          set -e
          git remote add upstream https://github.com/seerge/g-helper.git 2>/dev/null || git remote set-url upstream https://github.com/seerge/g-helper.git
          git fetch upstream --tags --force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PRE_SYNC_SHA=$(git rev-parse HEAD)
          echo "Pre-sync fork main: $PRE_SYNC_SHA"

          # Replay fork commits on top of latest upstream. During a rebase, -X theirs
          # means "the replayed fork commit wins", so custom code is preserved even
          # where upstream touched the same files.
          if ! git rebase -X theirs upstream/main; then
            echo "Rebase stopped — resolving residual conflicts (add/delete on workflow files)"
            for i in 1 2 3 4 5; do
              UNRESOLVED=$(git diff --name-only --diff-filter=U)
              [ -z "$UNRESOLVED" ] && break
              # Add/delete conflicts (e.g. upstream's release.yml vs fork's removal):
              # the fork does not want upstream workflow files, so remove them
              git rm -f $UNRESOLVED 2>/dev/null || true
              git add -A
              GIT_EDITOR=true git rebase --continue || break
            done
          fi

          # Reconcile the fork's known collisions with upstream. The fork's custom
          # commits were written against an old upstream, so -X theirs replays them
          # verbatim and clobbers upstream additions in the same spots. This is the
          # list of known collisions; anything else is caught by the build gate below.
          #
          # 1. AsusACPI.cs — the fork keeps this file identical to upstream. Its only
          #    historical deviation (the PerformanceWindows constant) now matches
          #    upstream's PerformanceFullSpeed name, but the old "Add Windows mode"
          #    commit still carries the old name and would clobber upstream's enum.
          #    Force upstream's version.
          git checkout upstream/main -- app/AsusACPI.cs

          # 2. Settings.cs — the same old commit re-adds the PerformanceWindows
          #    constant name; normalize it to upstream's PerformanceFullSpeed (same
          #    ACPI value 3, the UI label "Windows Mode" is unaffected).
          sed -i 's/AsusACPI\.PerformanceWindows/AsusACPI.PerformanceFullSpeed/g' app/Settings.cs

          # 3. Settings.cs — the fork's "Windows mode" button code overlaps the spot
          #    where upstream later added the PictureGPU_Click handler, so the replay
          #    can drop it. Re-add the handler if it went missing.
          python - <<'PY'
          path = 'app/Settings.cs'
          with open(path, encoding='utf-8', newline='') as f:
              text = f.read()
          if 'private void PictureGPU_Click' not in text:
              handler = (
                  '        private void PictureGPU_Click(object? sender, EventArgs e)\n'
                  '        {\n'
                  '            if (GPUModeControl.gpuError is not null)\n'
                  '                Process.Start(new ProcessStartInfo("devmgmt.msc") { UseShellExecute = true });\n'
                  '        }\n\n'
              )
              marker = '        private void ButtonSilent_Click(object? sender, EventArgs e)'
              if marker in text:
                  text = text.replace(marker, handler + marker, 1)
              else:
                  idx = text.rstrip().rfind('}')
                  text = text[:idx] + handler + text[idx:]
              with open(path, 'w', encoding='utf-8', newline='') as f:
                  f.write(text)
              print('Re-added PictureGPU_Click handler to Settings.cs')
          PY
          git add app/AsusACPI.cs app/Settings.cs
          GIT_EDITOR=true git commit -m "Reconcile fork custom code with upstream (AsusACPI enum, Windows mode name, GPU handler)" || true

          # GITHUB_TOKEN cannot push ANY change to .github/workflows/*. Restore the
          # fork's exact workflow files so the push contains zero workflow diffs.
          git checkout "$PRE_SYNC_SHA" -- .github/workflows
          git add .github/workflows
          GIT_EDITOR=true git commit -m "Restore fork workflow files after upstream sync" || true

          # Verify the custom code survived the rebase
          if ! grep -q "WindowsMode" app/Properties/Strings.resx || ! grep -q "Fodi9159" app/AutoUpdate/AutoUpdateControl.cs || ! grep -q "PerformanceFullSpeed" app/AsusACPI.cs; then
            echo "custom_missing=true" >> "$GITHUB_ENV"
          fi

      - name: Alert if custom code was lost
        if: env.custom_missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "Custom code missing after upstream sync" --json number -q '.[0].number' 2>/dev/null)
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "Custom code missing after upstream sync" \
              --body "The rebase onto upstream/main dropped custom fork code or an upstream symbol the fork relies on (Windows mode, fork auto-update URL, or the AsusACPI enum). The sync was **not** pushed. Fix locally with \`git fetch upstream && git rebase -X theirs upstream/main\` and push the fix, or update the marker checks in \`.github/workflows/sync-upstream.yml\`."
          fi
          echo "Custom code missing — aborting sync"
          exit 1

      - name: Bump version to upstream release
        if: env.custom_missing != 'true'
        shell: bash
        run: |
          TAG="${{ needs.check.outputs.upstream_tag }}"
          VERSION="${TAG#v}"
          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>${VERSION}</AssemblyVersion>|" app/GHelper.csproj
          sed -i "s|<AssemblyFileVersion>.*</AssemblyFileVersion>|<AssemblyFileVersion>${VERSION}</AssemblyFileVersion>|" app/GHelper.csproj
          git add app/GHelper.csproj
          GIT_EDITOR=true git commit -m "Bump version to ${VERSION} for upstream sync release" || true
          echo "Version set to $VERSION"

      - name: Build synced code (main is only pushed if this passes)
        if: env.custom_missing != 'true'
        shell: bash
        run: |
          if ! dotnet publish app/GHelper.sln --configuration Release --runtime win-x64 -p:PublishSingleFile=true --no-self-contained; then
            echo "build_failed=true" >> "$GITHUB_ENV"
          fi

      - name: Alert if build failed (main NOT pushed)
        if: env.build_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "Sync build failed after upstream rebase" --json number -q '.[0].number' 2>/dev/null)
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "Sync build failed after upstream rebase" \
              --body "The fork rebased onto upstream/main but the code does not compile, so main was **not** pushed. Reproduce locally with \`git fetch upstream && git rebase -X theirs upstream/main\`, fix the compile errors, push the fix, then re-run this workflow via workflow_dispatch."
          fi
          echo "Build failed — aborting without pushing main"
          exit 1

      - name: Push synced main
        if: env.build_failed != 'true'
        shell: bash
        run: |
          git push --force-with-lease origin main
          echo "Synced main pushed: $(git rev-parse --short HEAD)"

      - name: Package ZIP
        if: env.build_failed != 'true'
        shell: powershell
        run: |
          $exe = Get-ChildItem "app\bin\x64\Release" -Recurse -Filter "GHelper.exe" | Where-Object FullName -match "publish" | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "GHelper.zip" -Force
          Write-Host "Packed: $($exe.FullName)"

      - name: Create release on fork
        if: env.build_failed != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check.outputs.upstream_tag }}"
          gh release create "$TAG" GHelper.zip \
            --repo "${{ github.repository }}" \
            --title "G-Helper $TAG" \
            --notes "Auto-built from upstream [seerge/g-helper]($TAG) with custom fork patches (Windows mode, FreeSync toggle, fork auto-update)."
